<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="마녀소탕">
<meta name="theme-color" content="#1b1640">
<meta name="format-detection" content="telephone=no">
<meta property="og:title" content="마녀 할머니 소탕 대작전">
<meta property="og:description" content="이준·우현·꼬미가 문제를 풀어 마녀 할머니의 잔소리 마법을 풀어요!">
<meta property="og:image" content="/og.jpg">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<style>*,*::before,*::after{box-sizing:border-box}html{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%;background:#1b1640;-webkit-text-size-adjust:100%}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>마녀 할머니 소탕 대작전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: one-screen portrait game. HUD on top, night-sky arena in the middle, question card + 2x2 answer pad at thumb level. Single deliberate night-storybook look. */
:root{
  --night:#1b1640; --night2:#2b2163; --panel:#2f2770; --line:#4a3fa0;
  --moon:#ffe9a3; --card:#fff8e7; --card-edge:#d6c79c; --ink:#2a1f4a;
  --gold:#ffd447; --gold-d:#c9930f; --hex:#7cda5a;
  --hurt:#ff5a6e; --muted:#c3bbef; --robe:#6b3fa0;
  --f-display:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:#fff;font-family:var(--f-body);overflow:hidden;word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 70% at 75% 0%,#3d2f8f 0%,var(--night2) 42%,var(--night) 100%)}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw 3.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
#app{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---------- title ---------- */
#title{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:16px 28px;gap:14px}
.kicker{margin:0;text-align:center;font-family:var(--f-display);font-size:19px;color:var(--hex);letter-spacing:2px}
.logo{margin:2px 0 0;text-align:center;font-family:var(--f-display);font-weight:400;font-size:clamp(38px,11.5vw,58px);line-height:1.04;color:var(--gold);text-shadow:0 4px 0 #8a4b00,0 10px 22px rgba(0,0,0,.45);text-wrap:balance}
.logo em{font-style:normal;color:#ff7a8a;text-shadow:0 4px 0 #8a1f30,0 10px 22px rgba(0,0,0,.45)}
.title-art{position:relative;width:min(74%,290px);margin:0 auto}
.title-witch{width:82%;aspect-ratio:220/240;animation:bob 3s ease-in-out infinite}
.title-witch svg,.title-pet svg{width:100%;height:100%;display:block;overflow:visible}
.title-pet{position:absolute;right:-2%;bottom:-2%;width:36%;aspect-ratio:120/110;animation:hop 1.8s ease-in-out infinite}
.intro{margin:0;text-align:center;font-size:16px;line-height:1.6;color:#ece7ff}
.group{display:flex;flex-direction:column;gap:8px}
.label{margin:0;font-family:var(--f-display);font-size:18px;color:var(--muted);letter-spacing:.5px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips.subj{grid-template-columns:repeat(2,1fr)}
.chip{background:var(--panel);border:3px solid var(--line);border-radius:18px;font-family:var(--f-display);font-size:19px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;transition:transform .1s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{border-color:var(--gold);background:#4a3c9e;box-shadow:0 0 0 4px rgba(255,212,71,.22)}
.chip .cface{display:block;width:58px;height:60px}
.chip .cface.duo{width:88px}
.chip .cface svg{width:100%;height:100%;display:block;overflow:visible}
.chip small{font-family:var(--f-body);font-size:12px;color:var(--muted)}
.opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.toggle{background:transparent;border:2px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--muted)}
.toggle[aria-pressed="true"]{color:#fff;border-color:var(--hex);background:rgba(124,218,90,.14)}
.btn{display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:24px;border:0;border-radius:18px;padding:14px 18px;background:var(--gold);color:#3a2300;box-shadow:0 6px 0 var(--gold-d);transition:transform .08s,box-shadow .08s;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-d)}
.btn.big{font-size:30px;padding:16px}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;border:2px solid var(--line);font-size:17px;padding:11px 14px}
.btn.ghost:active{transform:none}
.best{margin:0;text-align:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- game ---------- */
#game{gap:8px;padding-block:8px 12px}
.hud{display:flex;align-items:center;gap:8px;font-family:var(--f-display)}
.quit{background:var(--panel);border:2px solid var(--line);border-radius:12px;font-size:14px;padding:5px 10px;color:var(--muted)}
.stage-tag{font-size:15px;background:var(--panel);padding:6px 12px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hearts{display:flex;gap:2px;margin-left:auto}
.hearts svg{width:21px;height:20px;display:block}
.hearts svg.pop{animation:pop .5s}
.score{font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.arena{position:relative;flex:1 1 auto;min-height:200px;border-radius:22px;overflow:hidden;border:3px solid var(--line);transition:background .6s}
.arena[data-stage="0"]{background:linear-gradient(#251c62,#45379a)}
.arena[data-stage="1"]{background:linear-gradient(#123344,#2c6a5f)}
.arena[data-stage="2"]{background:linear-gradient(#36123d,#6d2a5c)}
.arena.shake{animation:shake .4s}
.moon{position:absolute;left:5%;top:17%;width:46px;height:46px;border-radius:50%;background:var(--moon);box-shadow:0 0 40px 10px rgba(255,233,163,.3)}
.scenery{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%}
.scenery .garden,.scenery .castle,.scenery .reeds{display:none}
.arena[data-stage="0"] .garden,.arena[data-stage="1"] .reeds,.arena[data-stage="2"] .castle{display:inline}
.hp{position:absolute;left:10px;right:10px;top:8px;display:flex;align-items:center;gap:8px;z-index:3}
.hp-name{font-family:var(--f-display);font-size:14px;color:#efe8ff;white-space:nowrap}
.hp-bar{flex:1;height:15px;background:rgba(0,0,0,.35);border-radius:999px;overflow:hidden;border:2px solid rgba(255,255,255,.28)}
.hp-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff4f6d,#ffa35a);transition:width .45s ease}
.witch{position:absolute;right:2%;top:13%;height:56%;aspect-ratio:220/240;animation:bob 2.6s ease-in-out infinite;z-index:2}
.witch svg{width:100%;height:100%;display:block;overflow:visible}
.heroes{position:absolute;left:2%;bottom:2%;height:54%;display:flex;align-items:flex-end;z-index:2}
.heroes.duo .hero{height:84%}
.heroes.duo .hero+.hero{margin-left:-26px}
.hero{height:100%;aspect-ratio:160/210;transition:transform .35s,opacity .35s,filter .35s;transform-origin:50% 100%}
.hero svg{width:100%;height:100%;display:block;overflow:visible}
.heroes.duo .hero.idle{transform:scale(.8);opacity:.6;filter:saturate(.6)}
.heroes.duo .hero.on{z-index:1}
.pet{position:relative;height:40%;aspect-ratio:120/110;margin-left:-14px;background:none;border:0;padding:0;flex:none;transform-origin:50% 100%;z-index:3}
.pet svg,.title-pet svg,.gpet{filter:drop-shadow(0 0 2.5px rgba(255,255,255,.6))}
.pet svg{width:100%;height:100%;display:block;overflow:visible}
.pet .chance{position:absolute;left:50%;top:-18px;transform:translateX(-50%);background:var(--gold);color:#3a2300;font-family:var(--f-display);font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 0 var(--gold-d);animation:pulse 1.4s ease-in-out infinite}
.pet.used .chance{display:none}
.pet.hop{animation:hop .5s}
.pet.sad{animation:sad .6s}
.hit{animation:hit .5s}
.dizzy{animation:dizzy 1.2s ease-in-out 2}
.bubble{position:absolute;left:18%;top:15%;max-width:46%;background:#fff;color:var(--ink);font-family:var(--f-display);font-size:15px;line-height:1.3;border-radius:14px;padding:7px 11px;z-index:4;opacity:0;transform:scale(.6);transform-origin:100% 100%;transition:opacity .2s,transform .2s;pointer-events:none;text-wrap:balance}
.bubble::after{content:"";position:absolute;right:-8px;bottom:8px;border:8px solid transparent;border-left-color:#fff;border-right:0}
.bubble.on{opacity:1;transform:scale(1)}
.hbubble{position:absolute;left:0;top:0;transform:translate(-50%,-100%) scale(.6);background:var(--gold);color:#3a2300;font-family:var(--f-display);font-size:17px;border-radius:12px;padding:4px 11px;z-index:5;opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;white-space:nowrap;box-shadow:0 3px 0 var(--gold-d)}
.hbubble.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
.combo{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:26px;color:var(--gold);text-shadow:0 3px 0 #8a4b00;z-index:5;pointer-events:none;opacity:0;white-space:nowrap}
.combo.on{animation:comboIn 1s forwards}
.banner{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:4px;background:rgba(14,9,38,.62);z-index:7;font-family:var(--f-display);text-align:center;animation:fadeIn .25s}
.banner b{font-weight:400;font-size:44px;color:var(--gold);text-shadow:0 4px 0 #8a4b00;animation:pop .6s}
.banner span{font-size:22px;color:#efe8ff}
.bolt,.ball,.emo{position:absolute;left:0;top:0;width:36px;height:36px;margin:-18px 0 0 -18px;z-index:6;pointer-events:none}
.bolt{background:var(--gold);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);filter:drop-shadow(0 0 8px #fff3a0)}
.ball svg{width:100%;height:100%;display:block}
.emo{width:44px;height:44px;margin:-22px 0 0 -22px;font-size:36px;line-height:44px;text-align:center;filter:drop-shadow(0 0 10px rgba(124,218,90,.8))}
.spark{position:absolute;left:0;top:0;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;z-index:6;pointer-events:none}
.float{position:absolute;left:0;top:0;font-family:var(--f-display);font-size:30px;color:#fff;text-shadow:0 3px 0 #c0263c,0 0 10px #ff5a6e;z-index:6;pointer-events:none;white-space:nowrap}
.float.heal{text-shadow:0 3px 0 #b8336d,0 0 10px #ff8fc8}
.float.bark{font-size:20px;text-shadow:0 2px 0 #8a4b00,0 0 8px #ffd447}
.float.ouch{font-size:19px;text-shadow:0 2px 0 #3d1a6e,0 0 8px #b07cff}
.timer-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);white-space:nowrap}
.timer{flex:1;height:13px;border-radius:999px;background:var(--panel);overflow:hidden;position:relative;border:2px solid var(--line)}
.timer i{position:absolute;inset:0;transform-origin:0 50%;background:linear-gradient(90deg,var(--hex),#c9ff6a)}
.timer i.low{background:linear-gradient(90deg,#ff5a6e,#ff9a5a)}
.card{background:var(--card);color:var(--ink);border-radius:20px;padding:10px 14px 12px;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;box-shadow:0 6px 0 var(--card-edge)}
.card-top{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.turn{font-family:var(--f-display);font-size:14px;padding:2px 11px;border-radius:999px;color:#fff}
.qtag{font-size:12px;padding:2px 9px;border-radius:999px;background:#ece2c4;color:#6a5a2c;letter-spacing:.5px}
.qtext{font-family:var(--f-display);font-size:clamp(24px,7vw,32px);line-height:1.25;text-wrap:balance;font-variant-numeric:tabular-nums}
.qtext.long{font-size:clamp(17px,4.9vw,21px);line-height:1.4}
.visual:empty{display:none}
.visual svg{width:74px;height:74px;display:block}
.explain{display:flex;flex-direction:column;gap:2px;font-size:15px;line-height:1.45;color:#4b3d6e}
.explain b{font-family:var(--f-display);font-weight:400;font-size:22px;color:#2f8a18}
.explain .why{font-family:var(--f-display);font-size:15px;color:#c0263c}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{min-height:62px;font-family:var(--f-display);font-size:25px;border:0;border-radius:16px;background:#fff;color:var(--ink);box-shadow:0 5px 0 #b3a9de;padding:6px 8px;line-height:1.2;transition:transform .08s,box-shadow .08s,opacity .3s;font-variant-numeric:tabular-nums;word-break:keep-all}
.ans:active{transform:translateY(3px);box-shadow:0 2px 0 #b3a9de}
.ans.sm{font-size:18px}
.ans.xs{font-size:15px}
.ans.right{background:#a4f17f;box-shadow:0 5px 0 #4fa52f;animation:pop .4s}
.ans.wrong{background:#ffa0ab;box-shadow:0 5px 0 #c84a5a;animation:nope .4s}
.ans.gone{opacity:.18;pointer-events:none}
.ans:disabled{cursor:default}
.next{width:100%}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(10,6,30,.74);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:fadeIn .2s}
.modal{background:var(--card);color:var(--ink);border-radius:26px;padding:22px 18px;width:100%;max-width:400px;max-height:100%;overflow-y:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 8px 0 var(--card-edge);animation:pop .4s}
.modal h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;color:#6b3fa0;text-wrap:balance}
.modal p{margin:0;font-size:16px;line-height:1.6}
.modal .say{font-family:var(--f-display);font-size:18px;line-height:1.45;background:#efe6ff;border-radius:14px;padding:10px 12px;color:#4a2a7a}
.modal .loot{font-size:14px;color:#7a5a1a;background:#fff0c2;border-radius:12px;padding:6px 12px}
.modal .stats{display:flex;gap:18px;justify-content:center;font-variant-numeric:tabular-nums}
.modal .stats div{display:flex;flex-direction:column;font-size:13px;color:#6a5a8a}
.modal .stats b{font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--ink)}
.modal .stars{display:flex;gap:6px}
.modal .stars svg{width:44px;height:44px}
.gfaces{display:flex;align-items:flex-end;justify-content:center;gap:2px}
.gfaces .gface{width:110px;height:120px;animation:bob 2.4s ease-in-out infinite}
.gfaces .gpet{width:78px;height:72px}
.mbtns{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:4px}
.modal .btn.ghost{color:#5b4a86;border-color:#d8cdae}

.witch-svg .hat{transition:transform 1.2s cubic-bezier(.3,-.3,.6,1),opacity 1.2s;transform-box:fill-box;transform-origin:50% 100%}
.witch-svg.good .hat{transform:translate(80px,-260px) rotate(60deg);opacity:0}
.witch-svg .robe{fill:var(--robe);stroke:var(--robe);transition:fill 1s,stroke 1s}
.witch-svg.good .robe{fill:#ff8fbf;stroke:#ff8fbf}
.witch-svg .wglow{animation:tw 1.2s ease-in-out infinite}
.witch-svg.good .wglow{fill:#ff8fbf}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-9px) rotate(1.5deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) rotate(-6deg)}}
@keyframes sad{0%,100%{transform:rotate(0)}30%{transform:rotate(8deg) scale(.92)}60%{transform:rotate(-6deg) scale(.95)}}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.12)}}
@keyframes hit{0%,100%{transform:translateX(0)}15%{transform:translateX(-10px) rotate(-6deg);filter:brightness(1.6) drop-shadow(0 0 12px #ff5a6e)}35%{transform:translateX(9px) rotate(5deg)}55%{transform:translateX(-6px)}75%{transform:translateX(4px)}}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
@keyframes dizzy{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) translateY(4px)}75%{transform:rotate(14deg) translateY(4px)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes comboIn{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}
@media (prefers-reduced-motion:reduce){
  .title-witch,.title-pet,.pet .chance,.witch,.star,.gfaces .gface,.witch-svg .wglow{animation:none}
  .hit,.dizzy,.arena.shake{animation-duration:.01s}
}
</style>

</head>
<body>
<div class="sky" id="sky"></div>

<div id="app">
  <!-- ===== TITLE ===== -->
  <section id="title" class="screen">
    <header>
      <p class="kicker">이준 · 우현 · 꼬미의</p>
      <h1 class="logo">마녀 할머니<br><em>소탕</em> 대작전</h1>
    </header>
    <div class="title-art"><div class="title-witch" id="titleWitch"></div><div class="title-pet" id="titlePet"></div></div>
    <p class="intro">할머니가 잔소리 마법에 걸려 마녀가 됐어요!<br>문제를 맞히면 마법 공격이 슝! 날아가요.<br>어려울 땐 꼬미를 누르면 힌트를 줘요.</p>
    <div class="group">
      <p class="label">누가 출동할까?</p>
      <div class="chips" id="modeChips">
        <button class="chip" id="m_ijun" data-mode="ijun" aria-pressed="false"><span class="cface" data-face="ijun"></span>이준</button>
        <button class="chip" id="m_woo" data-mode="woo" aria-pressed="false"><span class="cface" data-face="woo"></span>우현</button>
        <button class="chip" id="m_duo" data-mode="duo" aria-pressed="false"><span class="cface duo" data-face="duo"></span>둘이 함께</button>
      </div>
    </div>
    <div class="group">
      <p class="label">어떤 문제로 싸울까?</p>
      <div class="chips subj" id="subjChips">
        <button class="chip" id="s_mix" data-subj="mix" aria-pressed="false">모두 섞기<small>수학 · 국어 · 상식</small></button>
        <button class="chip" id="s_math" data-subj="math" aria-pressed="false">수학<small>덧뺄셈 · 곱셈 · 나눗셈 · 분수</small></button>
        <button class="chip" id="s_kor" data-subj="kor" aria-pressed="false">국어<small>맞춤법 · 속담 · 높임말</small></button>
        <button class="chip" id="s_sci" data-subj="sci" aria-pressed="false">과학 · 상식<small>자석 · 곤충 · 지구</small></button>
      </div>
    </div>

    html: `<p class="say">마녀 할머니: "히히히! 졌으니까 브로콜리 세 접시 먹기다~"</p>
      <p>괜찮아요! 틀린 문제에서 배우는 게 진짜 실력이에요.</p>`,
    buttons: [
      { label: '복수하러 가기!', fn: () => startStage() },
      { label: '처음 화면', ghost: true, fn: () => { state.run++; renderTitle(); show('title'); } }
    ]
  });
}
$('#quitBtn').onclick = () => {
  SFX.tap(); pauseTimer();
  showModal({
    title: '잠깐 쉬어 갈까요?',
    html: '<p>처음 화면으로 가면 지금 게임은 끝나요.</p>',
    buttons: [
      { label: '계속 소탕하기', fn: () => resumeTimer() },
      { label: '처음 화면으로', ghost: true, fn: () => { state.run++; stopTimer(); renderTitle(); show('title'); } }
    ]
  });
};

/* ---------- HUD ---------- */
function updateHP(){ $('#hpFill').style.width = (100 * state.hp / state.maxHp) + '%'; }
function updateScore(){ $('#score').textContent = state.score.toLocaleString() + '점'; }
function renderHearts(popLast){
  const el = $('#hearts');
  el.innerHTML = Array.from({ length: state.maxHearts }, (_, i) => heartSVG(i < state.hearts)).join('');
  if (popLast && el.children[state.hearts]) el.children[state.hearts].classList.add('pop');
}
let sayT = 0;
function say(text, ms){
  const b = $('#bubble'); b.textContent = text; b.classList.add('on');
  clearTimeout(sayT); sayT = setTimeout(() => b.classList.remove('on'), ms || 1500);
}

/* ---------- timer ---------- */
function startTimer(ms){ state.tDur = ms; state.tLeft = ms; $('#timerRow').hidden = !state.timed; resumeTimer(); }
function resumeTimer(){
  if (!state.timed || state.locked || $('#game').hidden) return;
  cancelAnimationFrame(state.raf);
  state.tEnd = performance.now() + state.tLeft;
  const fill = $('#timerFill');
  const tick = () => {
    state.tLeft = state.tEnd - performance.now();
    const f = Math.max(0, state.tLeft / state.tDur);
    fill.style.transform = `scaleX(${f})`; fill.classList.toggle('low', f < .3);
    if (state.tLeft <= 0) { timeUp(); return; }
    state.raf = requestAnimationFrame(tick);
  };
  state.raf = requestAnimationFrame(tick);
}
function pauseTimer(){ cancelAnimationFrame(state.raf); }
function stopTimer(){ cancelAnimationFrame(state.raf); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) pauseTimer();
  else if ($('#overlay').hidden) resumeTimer();
});

/* ---------- effects ---------- */
function center(el){
  const a = arena.getBoundingClientRect(), r = el.getBoundingClientRect();
  return [r.left + r.width / 2 - a.left, r.top + r.height / 2 - a.top];
}
function replay(el, cls){ el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); }
function shoot(from, to, cls, content){
  return new Promise(res => {
    const [x0, y0] = center(from), [x1, y1] = center(to);
    const d = document.createElement('div'); d.className = cls;
    if (cls === 'ball') d.innerHTML = BALL; else if (content) d.textContent = content;
    arena.appendChild(d);
    SFX.whoosh();
    const mx = (x0 + x1) / 2, my = Math.min(y0, y1) - 46, spin = cls === 'emo' ? 30 : 380;
    const anim = d.animate([
      { transform: `translate(${x0}px,${y0}px) scale(.5) rotate(0deg)` },
      { transform: `translate(${mx}px,${my}px) scale(1.1) rotate(${spin / 2}deg)`, offset: .5 },
      { transform: `translate(${x1}px,${y1}px) scale(1.4) rotate(${spin}deg)` }
    ], { duration: reduceMotion ? 160 : 580, easing: 'ease-in' });
    anim.onfinish = () => { d.remove(); res(); };
  });
}
function sparks(x, y, colors){
  if (reduceMotion) return;
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('div'); s.className = 'spark'; s.style.background = pick(colors);
    arena.appendChild(s);
    const ang = Math.random() * Math.PI * 2, dist = R(30, 70);
    s.animate([
      { transform: `translate(${x}px,${y}px) scale(1)`, opacity: 1 },
      { transform: `translate(${x + Math.cos(ang) * dist}px,${y + Math.sin(ang) * dist}px) scale(.2)`, opacity: 0 }
    ], { duration: R(450, 750), easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => s.remove();
  }
}
function floatText(x, y, text, cls){
  const f = document.createElement('div'); f.className = 'float' + (cls ? ' ' + cls : ''); f.textContent = text;
  arena.appendChild(f);
  const aw = arena.clientWidth, fw = f.offsetWidth;
  x = Math.max(fw / 2 + 4, Math.min(aw - fw / 2 - 4, x));
  f.animate([
    { transform: `translate(${x}px,${y}px) translate(-50%,-50%) scale(.6)`, opacity: 0 },
    { transform: `translate(${x}px,${y - 20}px) translate(-50%,-50%) scale(1.2)`, opacity: 1, offset: .25 },
    { transform: `translate(${x}px,${y - 60}px) translate(-50%,-50%) scale(1)`, opacity: 0 }
  ], { duration: 1300, easing: 'ease-out' }).onfinish = () => f.remove();
}

/* ---------- modal ---------- */
function showModal({ title, html, buttons }){
  const m = $('#modal');
  m.innerHTML = `<h2>${title}</h2>${html || ''}<div class="mbtns"></div>`;
  const box = m.querySelector('.mbtns');
  buttons.forEach((b, i) => {
    const el = document.createElement('button');
    el.className = 'btn' + (b.ghost ? ' ghost' : ''); el.id = 'mb' + i; el.textContent = b.label;
    el.onclick = () => { SFX.tap(); $('#overlay').hidden = true; b.fn(); };
    box.appendChild(el);
  });
  $('#overlay').hidden = false;
}

/* ---------- boot ---------- */
(function stars(){
  const sky = $('#sky');
  for (let i = 0; i < 46; i++) {
    const s = document.createElement('i'); s.className = 'star'; const z = Math.random() < .2 ? 3 : 2;
    s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;width:${z}px;height:${z}px;opacity:${.4 + Math.random() * .5};animation-delay:${-Math.random() * 3}s`;
    sky.appendChild(s);
  }
})();
renderTitle();
show('title');
})();
</script>
